services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: neighborhood_safety_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-neighborhood_safety}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - neighborhood_safety_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-neighborhood_safety}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neighborhood_safety_postgres_data:
    name: neighborhood_safety_postgres_data
